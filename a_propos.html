<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stelvinne | Contact</title>
    <style>
        :root {
            --couleur-sombre-fond: #12141c;
            --couleur-sombre-carte: #181b25;
            --couleur-accent: #e65f49;
            --couleur-texte-principal: #ffffff;
            --couleur-texte-secondaire: #a0a5b5;
            --police-principale: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
            /* Couleurs officielles des réseaux */
            --whatsapp: #25D366;
            --youtube: #FF0000;
            --facebook: #1877F2;
            --instagram: #E1306C;
            --telegram: #0088cc;
            --email: #ea4335;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--police-principale);
            background-color: var(--couleur-sombre-fond);
            color: var(--couleur-texte-principal);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- NAVIGATION RESTYLISÉE --- */
        header {
            width: 100%;
            background: var(--couleur-sombre-carte);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-conteneur {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            height: 35px;
            width: auto;
        }

        .nav-liens {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-liens a {
            text-decoration: none;
            color: var(--couleur-texte-secondaire);
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-liens a:hover, .nav-liens a.actif {
            color: var(--couleur-accent);
        }

        /* --- SECTION CONTACT --- */
        .section-contact {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
            flex: 1;
        }

        .contact-entete {
            margin-bottom: 40px;
        }

        .contact-surtitre {
            color: var(--couleur-accent);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 10px;
            display: block;
        }

        .contact-titre {
            font-size: 2.5rem;
            font-weight: 700;
        }

        /* Grille des réseaux sociaux */
        .grille-reseaux {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 40px;
        }

        .carte-reseau {
            background-color: var(--couleur-sombre-carte);
            padding: 30px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--couleur-texte-principal);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .carte-reseau:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .icone-cadre {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            transition: background-color 0.3s;
        }

        .reseau-nom {
            font-size: 18px;
            font-weight: 600;
        }

        .reseau-action {
            font-size: 13px;
            color: var(--couleur-texte-secondaire);
        }

        /* Attribution des couleurs individuelles aux icônes au survol */
        .whatsapp .icone-cadre { background-color: rgba(37, 211, 102, 0.1); color: var(--whatsapp); }
        .whatsapp:hover .icone-cadre { background-color: var(--whatsapp); color: white; }

        .youtube .icone-cadre { background-color: rgba(255, 0, 0, 0.1); color: var(--youtube); }
        .youtube:hover .icone-cadre { background-color: var(--youtube); color: white; }

        .facebook .icone-cadre { background-color: rgba(24, 119, 242, 0.1); color: var(--facebook); }
        .facebook:hover .icone-cadre { background-color: var(--facebook); color: white; }

        .instagram .icone-cadre { background-color: rgba(225, 48, 108, 0.1); color: var(--instagram); }
        .instagram:hover .icone-cadre { background-color: var(--instagram); color: white; }

        .telegram .icone-cadre { background-color: rgba(0, 136, 204, 0.1); color: var(--telegram); }
        .telegram:hover .icone-cadre { background-color: var(--telegram); color: white; }

        .email .icone-cadre { background-color: rgba(234, 67, 53, 0.1); color: var(--email); }
        .email:hover .icone-cadre { background-color: var(--email); color: white; }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .nav-conteneur {
                flex-direction: column;
                gap: 15px;
            }
            .grille-reseaux {
                grid-template-columns: repeat(2, 1fr);
            }
            .contact-titre {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .grille-reseaux {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav class="nav-conteneur">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Stelvinne Logo">
            </a>
            <ul class="nav-liens">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="a_propos.html">À Propos</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contact.html" class="actif">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="section-contact">
        <div class="contact-entete">
            <span class="contact-surtitre">Discutons ensemble</span>
            <h1 class="contact-title">Mes Réseaux & Contacts</h1>
        </div>

        <div class="grille-reseaux">

            <a href="https://wa.me/243983558864" target="_blank" class="carte-reseau whatsapp">
                <div class="icone-cadre">💬</div>
                <span class="reseau-nom">WhatsApp</span>
                <span class="reseau-action">Discuter en direct</span>
            </a>

            <a href="https://t.me/ton_pseudo" target="_blank" class="carte-reseau telegram">
                <div class="icone-cadre">✈️</div>
                <span class="reseau-nom">Telegram</span>
                <span class="reseau-action">Me joindre rapidement</span>
            </a>

            <a href="mailto:stelvinne@gmail.com" class="carte-reseau email">
                <div class="icone-cadre">✉️</div>
                <span class="reseau-nom">E-mail</span>
                <span class="reseau-action">stelvinne@gmail.com</span>
            </a>

            <a href="#" target="_blank" class="carte-reseau youtube">
                <div class="icone-cadre">📺</div>
                <span class="reseau-nom">YouTube</span>
                <span class="reseau-action">Voir mes vidéos</span>
            </a>

            <a href="#" target="_blank" class="carte-reseau facebook">
                <div class="icone-cadre">👍</div>
                <span class="reseau-nom">Facebook</span>
                <span class="reseau-action">Suivre mon actualité</span>
            </a>

            <a href="#" target="_blank" class="carte-reseau instagram">
                <div class="icone-cadre">📸</div>
                <span class="reseau-nom">Instagram</span>
                <span class="reseau-action">Voir mes créations</span>
            </a>

        </div>
    </section>

</body>
</html>
